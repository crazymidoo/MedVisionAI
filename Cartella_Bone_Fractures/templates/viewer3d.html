<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MedVisionAI | 3D Bone Viewer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: sans-serif; }
    body { background: linear-gradient(135deg, #0f172a 0%, #1a1f3a 50%, #111f42 100%); }
    .layout { width: 100%; height: 100%; display: grid; grid-template-columns: 1fr 320px; gap: 16px; padding: 16px; }
    .viewport { position: relative; border-radius: 16px; border: 1px solid rgba(148, 163, 184, 0.2); background: #0a1117; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
    #canvas { width: 100%; height: 100%; display: block; }
    .badge { position: absolute; top: 14px; left: 14px; background: rgba(8, 17, 34, 0.85); border: 1px solid rgba(56, 189, 248, 0.35); color: #7dd3fc; font-size: 11px; font-weight: 700; padding: 6px 10px; border-radius: 999px; z-index: 10; }
    .panel { border: 1px solid rgba(148, 163, 184, 0.2); border-radius: 16px; background: rgba(14, 24, 44, 0.75); backdrop-filter: blur(10px); padding: 18px; display: flex; flex-direction: column; gap: 16px; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.4); }
    h1 { font-size: 22px; color: #e2e8f0; line-height: 1.1; letter-spacing: -0.02em; }
    .subtitle { font-size: 13px; color: #94a3b8; line-height: 1.6; }
    .card { border: 1px solid rgba(148, 163, 184, 0.18); border-radius: 10px; padding: 10px; background: rgba(13, 24, 44, 0.5); font-size: 12px; }
    .card h3 { font-size: 11px; font-weight: 700; color: #cbd5e1; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.05em; }
    .card p { color: #94a3b8; line-height: 1.5; }
    .status { padding: 10px; border-radius: 8px; background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(148, 163, 184, 0.2); font-size: 12px; color: #cbd5e1; min-height: 48px; display: flex; align-items: center; }
    .status.ready { color: #86e1a0; border-color: rgba(134, 225, 160, 0.35); }
    .back { color: #38bdf8; text-decoration: none; font-size: 12px; font-weight: 600; }
    .back:hover { text-decoration: underline; }
    #debug { position: absolute; bottom: 20px; left: 20px; background: rgba(0, 90, 0, 0.9); color: #88ff88; font-family: monospace; font-size: 10px; line-height: 1.4; padding: 10px; border-radius: 8px; border: 1px solid #2aff2a; max-width: 320px; max-height: 200px; overflow-y: auto; z-index: 20; }
    @media (max-width: 1024px) { .layout { grid-template-columns: 1fr; grid-template-rows: 1fr 280px; } }
  </style>
</head>
<body>
  <main class="layout">
    <section class="viewport">
      <div class="badge">Interactive Medical 3D</div>
      <canvas id="canvas"></canvas>
      <div id="debug"></div>
    </section>

    <aside class="panel">
      <a class="back" href="/">← Dashboard</a>
      <div>
        <h1>Human Bone 3D</h1>
        <p class="subtitle">Viewer interattivo con modello GLB realistico.</p>
      </div>
      <div class="card">
        <h3>Controlli</h3>
        <p>Trascina per ruotare • Scroll per zoom</p>
      </div>
      <div class="card">
        <h3>Frattura</h3>
        <p>Indicatore rosso con animazione pulsante</p>
      </div>
      <div class="card">
        <h3>Sorgente Clinica</h3>
        <p>BodyParts3D (DBCLS), Right Humerus FMA23130, CC BY-SA 2.1 JP</p>
      </div>
      <div id="status" class="status">Caricamento...</div>
    </aside>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

  <script>
    const canvas = document.getElementById('canvas');
    const debugEl = document.getElementById('debug');
    const statusEl = document.getElementById('status');
    const logs = [];

    function dbg(msg) {
      logs.push(msg);
      if (logs.length > 14) logs.shift();
      debugEl.innerHTML = logs.map((line) => line.replace(/</g, '&lt;')).join('<br>');
      console.log(msg);
    }

    dbg('THREE init: ' + (typeof THREE !== 'undefined' ? 'OK' : 'FAIL'));

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a1a);
    scene.fog = new THREE.Fog(0x1a1a1a, 14, 40);

    const camera = new THREE.PerspectiveCamera(45, canvas.clientWidth / canvas.clientHeight, 0.1, 1000);
    camera.position.set(0, 0.7, 9);

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(canvas.clientWidth, canvas.clientHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.22;
    dbg('Renderer OK');

    scene.add(new THREE.AmbientLight(0xb8a898, 0.85));
    scene.add(new THREE.HemisphereLight(0xfaf3ea, 0x2b3038, 0.7));

    const key = new THREE.DirectionalLight(0xf8f3eb, 1.5);
    key.position.set(7, 9, 6);
    key.castShadow = true;
    key.shadow.mapSize.set(2048, 2048);
    key.shadow.camera.far = 40;
    key.shadow.bias = -0.00005;
    key.shadow.normalBias = 0.02;
    scene.add(key);

    const rim = new THREE.DirectionalLight(0xcdbaa0, 0.7);
    rim.position.set(-6, 5, 7);
    scene.add(rim);

    const fill = new THREE.DirectionalLight(0xa89a8f, 0.45);
    fill.position.set(-4, 2, -4);
    scene.add(fill);

    dbg('Lights OK');

    const floor = new THREE.Mesh(
      new THREE.CircleGeometry(12, 64),
      new THREE.ShadowMaterial({ opacity: 0.28 })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -2.6;
    floor.receiveShadow = true;
    scene.add(floor);

    function createFallbackBone() {
      const group = new THREE.Group();
      const mat = new THREE.MeshStandardMaterial({ color: 0xf4e8db, roughness: 0.67, metalness: 0.004 });

      const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.55, 7.5, 32, 48), mat);
      shaft.castShadow = true;
      shaft.receiveShadow = true;
      group.add(shaft);

      const top = new THREE.Mesh(new THREE.IcosahedronGeometry(0.7, 4), mat);
      top.position.y = 4;
      top.scale.set(0.85, 1, 0.78);
      top.castShadow = true;
      top.receiveShadow = true;
      group.add(top);

      const bottom = new THREE.Mesh(new THREE.IcosahedronGeometry(0.55, 4), mat);
      bottom.position.y = -4.15;
      bottom.scale.set(0.8, 0.92, 0.72);
      bottom.castShadow = true;
      bottom.receiveShadow = true;
      group.add(bottom);

      return group;
    }

    let bone = createFallbackBone();
    scene.add(bone);
    dbg('Bone fallback visible');

    let controls = null;
    if (typeof THREE.OrbitControls === 'function') {
      controls = new THREE.OrbitControls(camera, canvas);
      controls.enableDamping = true;
      controls.dampingFactor = 0.06;
      controls.minDistance = 4;
      controls.maxDistance = 16;
      controls.target.set(0, 0.25, 0);
      controls.update();
      dbg('OrbitControls OK');
    } else {
      dbg('OrbitControls missing');
    }

    const fractureCore = new THREE.Mesh(
      new THREE.SphereGeometry(0.08, 20, 20),
      new THREE.MeshStandardMaterial({ color: 0xff5661, emissive: 0xff0015, emissiveIntensity: 1.2, roughness: 0.35 })
    );
    const fractureHalo = new THREE.Mesh(
      new THREE.SphereGeometry(0.14, 20, 20),
      new THREE.MeshStandardMaterial({ color: 0xff7a85, emissive: 0xff2f3f, emissiveIntensity: 0.75, transparent: true, opacity: 0.25 })
    );
    const fractureLight = new THREE.PointLight(0xff3b4c, 0.8, 2.3);
    const fractureGroup = new THREE.Group();
    fractureGroup.add(fractureCore, fractureHalo, fractureLight);
    fractureGroup.position.set(0.22, 1.1, 0.25);
    scene.add(fractureGroup);

    statusEl.textContent = 'Caricamento modello anatomico BodyParts3D...';

    const canLoadGltf = typeof THREE.GLTFLoader === 'function';
    dbg('GLTFLoader: ' + (canLoadGltf ? 'OK' : 'MISSING'));

    if (canLoadGltf) {
      const loader = new THREE.GLTFLoader();
      loader.load(
        '/static/models/bodyparts3d_right_humerus.glb',
        (gltf) => {
          scene.remove(bone);
          bone = gltf.scene;
          bone.position.set(0, 0, 0);
          bone.traverse((child) => {
            if (child.isMesh) {
              if (child.geometry && !child.geometry.attributes.normal) {
                child.geometry.computeVertexNormals();
              }
              child.castShadow = true;
              child.receiveShadow = false;
              child.material = new THREE.MeshStandardMaterial({
                color: 0xf4e8db,
                roughness: 0.6,
                metalness: 0.01,
                emissive: 0x1d1712,
                emissiveIntensity: 0.04,
                side: THREE.DoubleSide
              });
            }
          });

          const box = new THREE.Box3().setFromObject(bone);
          const center = box.getCenter(new THREE.Vector3());
          const size = box.getSize(new THREE.Vector3());
          const maxDim = Math.max(size.x, size.y, size.z);
          const targetSize = 5.0;
          const scale = targetSize / maxDim;

          bone.position.sub(center);
          bone.scale.setScalar(scale);

          if (controls) {
            controls.target.set(0, 0, 0);
            camera.position.set(0.9, 0.45, 7.5);
            controls.update();
          }

          scene.add(bone);
          statusEl.textContent = 'Modello GLB caricato';
          statusEl.classList.add('ready');
          dbg('GLB loaded ✓ size=' + maxDim.toFixed(2) + ' scale=' + scale.toFixed(4));
        },
        (p) => {
          if (p.total > 0) {
            const percent = Math.round((p.loaded / p.total) * 100);
            dbg('Loading ' + percent + '%');
          }
        },
        () => {
          statusEl.textContent = 'Errore GLB: fallback attivo';
          dbg('GLB load failed, fallback active');
        }
      );
    } else {
      statusEl.textContent = 'GLTFLoader non disponibile, fallback attivo';
    }

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();

      const pulse = 1 + Math.sin(t * 4.2) * 0.12;
      fractureCore.scale.setScalar(pulse);
      fractureHalo.scale.setScalar(1 + Math.sin(t * 4.2 + 0.7) * 0.18);

      if (controls) controls.update();
      renderer.render(scene, camera);
    }

    function onResize() {
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    }

    window.addEventListener('resize', onResize);
    onResize();
    animate();

    dbg('Ready');
  </script>
</body>
</html>
