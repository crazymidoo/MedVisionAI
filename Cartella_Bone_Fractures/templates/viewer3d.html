<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MedVisionAI | 3D Bone Viewer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: sans-serif; }
    body { background: linear-gradient(135deg, #0f172a 0%, #1a1f3a 50%, #111f42 100%); }
    .layout { width: 100%; height: 100%; display: grid; grid-template-columns: 1fr 320px; gap: 16px; padding: 16px; }
    .viewport { border-radius: 16px; border: 1px solid rgba(148, 163, 184, 0.2); background: #0a1117; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.5); position: relative; }
    #canvas { width: 100%; height: 100%; display: block; }
    .badge { position: absolute; top: 14px; left: 14px; background: rgba(8, 17, 34, 0.8); border: 1px solid rgba(56, 189, 248, 0.3); color: #7dd3fc; font-size: 11px; font-weight: 700; padding: 6px 10px; border-radius: 999px; backdrop-filter: blur(8px); z-index: 10; }
    .panel { border: 1px solid rgba(148, 163, 184, 0.2); border-radius: 16px; background: rgba(14, 24, 44, 0.7); backdrop-filter: blur(12px); padding: 18px; display: flex; flex-direction: column; gap: 16px; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.4); }
    .panel::-webkit-scrollbar { width: 6px; }
    .panel::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.3); border-radius: 3px; }
    h1 { font-size: 22px; color: #e2e8f0; line-height: 1.1; letter-spacing: -0.02em; margin: 0; }
    .subtitle { font-size: 13px; color: #94a3b8; line-height: 1.6; }
    .card { border: 1px solid rgba(148, 163, 184, 0.18); border-radius: 10px; padding: 10px; background: rgba(13, 24, 44, 0.5); font-size: 12px; }
    .card h3 { font-size: 11px; font-weight: 700; color: #cbd5e1; margin: 0 0 4px 0; text-transform: uppercase; letter-spacing: 0.05em; }
    .card p { color: #94a3b8; line-height: 1.5; margin: 0; }
    .status { padding: 10px; border-radius: 8px; background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(148, 163, 184, 0.2); font-size: 12px; color: #cbd5e1; min-height: 50px; display: flex; align-items: center; }
    .status.ready { color: #86e1a0; border-color: rgba(134, 225, 160, 0.3); }
    .back { color: #38bdf8; text-decoration: none; font-size: 12px; font-weight: 600; }
    .back:hover { text-decoration: underline; }
    @media (max-width: 1024px) { .layout { grid-template-columns: 1fr; grid-template-rows: 1fr 280px; } }
  </style>
</head>
<body>
  <main class="layout">
    <section class="viewport">
      <div class="badge">Interactive Medical 3D</div>
      <canvas id="canvas"></canvas>
    </section>
    <aside class="panel">
      <a class="back" href="/">← Dashboard</a>
      <div>
        <h1>Human Bone 3D</h1>
        <p class="subtitle">Viewer interattivo con rendering realistico.</p>
      </div>
      <div class="card">
        <h3>Controlli</h3>
        <p>Trascina per ruotare • Scroll per zoom</p>
      </div>
      <div class="card">
        <h3>Frattura</h3>
        <p>Indicatore rosso con animazione pulsante</p>
      </div>
      <div id="status" class="status">Caricamento...</div>
    </aside>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@r128/examples/js/controls/OrbitControls.js"></script>
  <script>
    const canvas = document.getElementById('canvas');
    const statusEl = document.getElementById('status');

    // Scene setup
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a1117);
    scene.fog = new THREE.Fog(0x0a1117, 10, 28);

    // Camera
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(2, 1.5, 8);

    // Renderer
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;

    // Lights
    const ambLight = new THREE.AmbientLight(0xb7c4d9, 0.48);
    scene.add(ambLight);

    const keyLight = new THREE.DirectionalLight(0xffffff, 1.3);
    keyLight.position.set(5, 7, 4);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(1024, 1024);
    keyLight.shadow.camera.far = 30;
    keyLight.shadow.bias = -0.0002;
    scene.add(keyLight);

    const pointLight = new THREE.PointLight(0x7dd3fc, 1.2, 20);
    pointLight.position.set(-4, 3, 5);
    scene.add(pointLight);

    const fillLight = new THREE.DirectionalLight(0x9ca3af, 0.4);
    fillLight.position.set(-3, 1.5, -3);
    scene.add(fillLight);

    // Floor
    const floor = new THREE.Mesh(
      new THREE.CircleGeometry(10, 64),
      new THREE.ShadowMaterial({ opacity: 0.2 })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -2;
    floor.receiveShadow = true;
    scene.add(floor);

    // Create procedural normal map for bone surface detail
    function createNormalMap() {
      const cvs = document.createElement('canvas');
      cvs.width = cvs.height = 512;
      const ctx = cvs.getContext('2d');
      
      // Base perlin-like noise
      ctx.fillStyle = '#7f7f7f';
      ctx.fillRect(0, 0, 512, 512);
      
      // Surface pores and texture
      for (let i = 0; i < 3000; i++) {
        const x = Math.random() * 512;
        const y = Math.random() * 512;
        const size = 0.5 + Math.random() * 2.5;
        const depth = 120 + Math.random() * 40;
        ctx.fillStyle = `rgb(${depth},${depth},${128 + Math.random() * 40})`;
        ctx.beginPath();
        ctx.arc(x, y, size, 0, Math.PI * 2);
        ctx.fill();
      }
      
      // Linear surface striations
      ctx.strokeStyle = 'rgba(100,100,128,0.3)';
      ctx.lineWidth = 0.7;
      for (let i = 0; i < 80; i++) {
        ctx.beginPath();
        ctx.moveTo(0, i * 6.4);
        ctx.lineTo(512, i * 6.4 + Math.sin(i) * 20);
        ctx.stroke();
      }
      
      const tex = new THREE.CanvasTexture(cvs);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(3, 8);
      return tex;
    }
    const normalMap = createNormalMap();

    // Create realistic bone using advanced geometry
    function createBone() {
      const group = new THREE.Group();

      // Diafisi (corpo dell'osso) con profilo anatomicamente accurato
      const profile = [
        new THREE.Vector2(0.00, 0.0),
        new THREE.Vector2(0.18, 0.05),
        new THREE.Vector2(0.32, 0.15),
        new THREE.Vector2(0.45, 0.35),
        new THREE.Vector2(0.52, 0.60),
        new THREE.Vector2(0.58, 1.10),
        new THREE.Vector2(0.62, 1.60),
        new THREE.Vector2(0.65, 2.10),
        new THREE.Vector2(0.68, 2.80),
        new THREE.Vector2(0.70, 3.40),
        new THREE.Vector2(0.71, 4.00),
        new THREE.Vector2(0.72, 4.60),
        new THREE.Vector2(0.70, 5.00),
        new THREE.Vector2(0.65, 5.25),
        new THREE.Vector2(0.58, 5.40),
        new THREE.Vector2(0.48, 5.50),
        new THREE.Vector2(0.35, 5.55),
        new THREE.Vector2(0.18, 5.58),
        new THREE.Vector2(0.00, 5.60)
      ];
      
      const shaftGeo = new THREE.LatheGeometry(profile, 128, 0, Math.PI * 2);
      shaftGeo.computeVertexNormals();
      const shaft = new THREE.Mesh(shaftGeo, new THREE.MeshStandardMaterial({
        color: 0xf5e6d3,
        roughness: 0.75,
        metalness: 0.01,
        roughnessMap: roughMap,
        side: THREE.FrontSide
      }));
      shaft.scale.set(1, 1.15, 1);
      shaft.position.y = -0.9;
      shaft.castShadow = true;
      shaft.receiveShadow = true;
      group.add(shaft);

      // Epifisi prossimale (testa superiore) - più grande e complessa
      const topHeadGeo = new THREE.IcosahedronGeometry(0.95, 6);
      const topHead = new THREE.Mesh(topHeadGeo, new THREE.MeshStandardMaterial({
        color: 0xebd9c3,
        roughness: 0.72,
        metalness: 0.02,
        roughnessMap: roughMap
      }));
      topHead.scale.set(0.95, 1.05, 0.88);
      topHead.position.y = 4.8;
      topHead.castShadow = true;
      topHead.receiveShadow = true;
      group.add(topHead);

      // Epifisi distale (testa inferiore) - più piccola
      const bottomHeadGeo = new THREE.IcosahedronGeometry(0.72, 6);
      const bottomHead = new THREE.Mesh(bottomHeadGeo, new THREE.MeshStandardMaterial({
        color: 0xebd9c3,
        roughness: 0.72,
        metalness: 0.02,
        roughnessMap: roughMap
      }));
      bottomHead.scale.set(0.82, 0.95, 0.78);
      bottomHead.position.y = -5.8;
      bottomHead.castShadow = true;
      bottomHead.receiveShadow = true;
      group.add(bottomHead);

      // Tuberosità prossimale (piccolo bump anatomico)
      const tibGeo = new THREE.BoxGeometry(0.35, 0.55, 0.42);
      const tib = new THREE.Mesh(tibGeo, new THREE.MeshStandardMaterial({
        color: 0xf5e6d3,
        roughness: 0.76,
        metalness: 0.01,
        roughnessMap: roughMap
      }));
      tib.position.set(0, 4.1, 0.48);
      tib.rotation.z = 0.15;
      tib.castShadow = true;
      tib.receiveShadow = true;
      group.add(tib);

      group.position.y = 0.5;
      group.castShadow = true;
      return group;
    }

    // Create fracture
    function createFracture() {
      const group = new THREE.Group();
      const core = new THREE.Mesh(new THREE.SphereGeometry(0.095, 24, 24),
        new THREE.MeshStandardMaterial({ color: 0xff5661, emissive: 0xff0015, emissiveIntensity: 1.2, roughness: 0.35, metalness: 0.05 }));
      const halo = new THREE.Mesh(new THREE.SphereGeometry(0.16, 24, 24),
        new THREE.MeshStandardMaterial({ color: 0xff7a85, emissive: 0xff2f3f, emissiveIntensity: 0.8, transparent: true, opacity: 0.3 }));
      const light = new THREE.PointLight(0xff3b4c, 0.9, 2.5);
      group.add(core, halo, light);
      group.position.set(0.24, -0.55, 0.22);
      return { group, core, halo, light };
    }

    // Add to scene
    const bone = createBone();
    scene.add(bone);
    const fracture = createFracture();
    scene.add(fracture.group);

    // Controls setup
    let controls;
    const mouseState = { x: 0, y: 0, down: false, deltaX: 0, deltaY: 0 };
    let rotation = { x: 0, y: 0 };
    let distance = 8;
    const target = new THREE.Vector3(0, 0.8, 0);

    try {
      if (typeof THREE.OrbitControls !== 'undefined') {
        controls = new THREE.OrbitControls(camera, canvas);
        controls.enableDamping = true;
        controls.dampingFactor = 0.06;
        controls.enablePan = true;
        controls.minDistance = 3;
        controls.maxDistance = 14;
        controls.target.copy(target);
        controls.update();
        statusEl.textContent = 'Pronto (OrbitControls)';
      }
    } catch (e) {
      console.warn('OrbitControls failed, using manual controls:', e);
    }

    // Manual fallback controls
    canvas.addEventListener('mousedown', (e) => {
      mouseState.down = true;
      mouseState.x = e.clientX;
      mouseState.y = e.clientY;
    });

    canvas.addEventListener('mousemove', (e) => {
      const deltaX = e.clientX - mouseState.x;
      const deltaY = e.clientY - mouseState.y;
      if (mouseState.down && !controls) {
        rotation.y += deltaX * 0.003;
        rotation.x += deltaY * 0.003;
      }
      mouseState.x = e.clientX;
      mouseState.y = e.clientY;
    });

    canvas.addEventListener('mouseup', () => { mouseState.down = false; });
    canvas.addEventListener('mouseleave', () => { mouseState.down = false; });

    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      if (controls) {
        controls.dollyIn(e.deltaY > 0 ? 1.05 : 0.95);
        controls.dollyOut(e.deltaY > 0 ? 0.95 : 1.05);
      } else {
        distance += e.deltaY * 0.003;
        distance = Math.max(3, Math.min(14, distance));
      }
    }, { passive: false });

    statusEl.textContent = 'Pronto';
    statusEl.classList.add('ready');

    // Animation
    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const elapsed = clock.getElapsedTime();
      
      // Fracture animation
      const pulse = 1 + Math.sin(elapsed * 4.2) * 0.12;
      fracture.core.scale.setScalar(pulse);
      fracture.halo.scale.setScalar(1 + Math.sin(elapsed * 4.2 + 0.7) * 0.2);
      fracture.core.material.emissiveIntensity = 1.1 + Math.sin(elapsed * 4.2) * 0.4;
      fracture.halo.material.opacity = 0.24 + Math.sin(elapsed * 4.2 + 0.9) * 0.08;
      fracture.light.intensity = 0.8 + Math.sin(elapsed * 4.2) * 0.35;
      
      // Manual controls (fallback)
      if (!controls) {
        const x = Math.cos(rotation.y) * Math.sin(rotation.x) * distance;
        const y = Math.cos(rotation.x) * distance;
        const z = Math.sin(rotation.y) * Math.sin(rotation.x) * distance;
        camera.position.set(x + target.x, y + target.y, z + target.z);
        camera.lookAt(target);
      }
      
      if (controls) controls.update();
      renderer.render(scene, camera);
    }

    function onResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    window.addEventListener('resize', onResize);
    animate();
  </script>
</body>
</html>
